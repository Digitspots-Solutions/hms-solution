version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html/
    depends_on:
      - db

  db:
    image: mariadb:10.5
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "hmsdb"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-information-tables/hmsdb.sql:/docker-entrypoint-initdb.d/hmsdb.sql
    ports:
      - "3306:3306"

volumes:
  db_data:

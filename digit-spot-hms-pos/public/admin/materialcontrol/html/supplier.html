<form action="" method="post" autocomplete="off" onsubmit="xframeenablescroll(); onsubmt('submitbutton','Submitting..')">
	<input type="hidden" name="uri" value="insert-supplier">
	<div class="xform bottom-push-15">
		<label>Supplier/Company</label>
		<input type="text" name="wgtf1" id="wgtf1" placeholder="Enter here e.g Kendra Foods" maxlength="150" class="nopads no-back-black" onkeypress="titleCase(this.value,this.id)" required="required">
	</div>
	<div class="xform bottom-push-15">
		<label>Contact Number</label>
		<input type="text" name="wgtf2" id="wgtf2" placeholder="Enter here e.g +248002003000" maxlength="16" class="nopads no-back-black" required="required">
	</div>
	<div class="xform bottom-push-15">
		<label>Contact Email</label>
		<input type="email" name="wgtf3" id="wgtf3" placeholder="Enter here e.g kendrafoods@yahoo.com" class="nopads no-back-black" required="required">
	</div>
	<div class="xform bottom-push-15">
		<label>City</label>
		<input type="text" name="wgtf4" id="wgtf4" placeholder="Enter here e.g Maryland, Lagos" class="nopads no-back-black" onkeypress="titleCase(this.value,this.id)" required="required">
	</div>
	<div class="xform bottom-push-15">
		<label>Country</label>
		<input type="text" name="wgtf5" id="wgtf5" placeholder="Enter here e.g Nigeria" class="nopads no-back-black" onkeypress="titleCase(this.value,this.id)">
	</div>
	<div class="xform bottom-push-15">
		<label>Representative</label>
		<input type="text" name="wgtf6" id="wgtf6" placeholder="Enter here e.g Momoh Rajay" class="nopads no-back-black" onkeypress="titleCase(this.value,this.id)">
	</div>
	<div class="top-push-50 motion">
		<input type="hidden" name="datau" id="datau" value="0">
		<input type="submit" id="submitbutton" name="submitbutton" value="Add to List" class="nc-width-100 submit blue-white-state  nunito-semibold rounded-button anchor letter-spacing-2 nodefault-appearance">
	</div>
</form>
